name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      MIN_COVERAGE: "35"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip install -r lockdin_mvp/requirements.txt
          pip install pytest-cov

      - name: Lint
        run: |
          ruff format --check scripts lockdin_mvp/app lockdin_mvp/tests
          ruff check scripts lockdin_mvp/app lockdin_mvp/tests

      - name: Type check
        run: |
          mypy --strict scripts/dev_doctor.py scripts/critique_milestone.py

      - name: Unit tests with coverage threshold
        run: |
          pytest lockdin_mvp/tests --maxfail=1 --cov=lockdin_mvp/app --cov-report=term-missing --cov-fail-under=${MIN_COVERAGE}

      - name: Development doctor (warn-safe in CI)
        run: |
          python scripts/dev_doctor.py --allow-warn

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          args: git --redact --verbose
