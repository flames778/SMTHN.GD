name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      MIN_COVERAGE: "45"
      PYTHONPATH: "lockdin_mvp"
      DATABASE_URL: "postgresql+psycopg://lockdin:lockdin@localhost:5432/lockdin_test"
      REDIS_URL: "redis://localhost:6379/15"
      APP_ENCRYPTION_KEY: "ci-only-encryption-key-32-characters"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip install -r lockdin_mvp/requirements.txt
          pip install pytest-cov

      - name: Lint
        run: |
          ruff format --check apps/backend scripts/dev_doctor.py scripts/critique_milestone.py
          ruff check apps/backend scripts/dev_doctor.py scripts/critique_milestone.py

      - name: Type check
        run: |
          mypy --strict scripts/dev_doctor.py scripts/critique_milestone.py
          mypy --strict apps/backend/lockdin_backend

      - name: Unit tests with coverage threshold
        run: |
          pytest apps/backend/tests lockdin_mvp/tests --maxfail=1 --cov=lockdin_backend --cov=lockdin_mvp/app --cov-report=term-missing --cov-fail-under=${MIN_COVERAGE}

      - name: Development doctor (warn-safe in CI)
        run: |
          python scripts/dev_doctor.py --allow-warn

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          args: git --redact --verbose
